<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuaHost</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0a;
  --surface: #111;
  --surface2: #1a1a1a;
  --surface3: #222;
  --border: #1f1f1f;
  --border2: #2a2a2a;
  --text: #f0f0f0;
  --text2: #666;
  --text3: #333;
  --accent: #fff;
  --green: #22c55e;
  --red: #ef4444;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}

/* NAV */
nav {
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 50;
}

.logo {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.3px;
}

.logo span {
  color: var(--text2);
  font-weight: 400;
}

.nav-url {
  font-family: monospace;
  font-size: 11px;
  color: var(--text2);
  background: var(--surface);
  border: 1px solid var(--border2);
  padding: 4px 10px;
  border-radius: 6px;
}

/* LAYOUT */
.layout {
  display: grid;
  grid-template-columns: 320px 1fr;
  min-height: calc(100vh - 52px);
}

/* SIDEBAR */
.sidebar {
  border-right: 1px solid var(--border);
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sidebar-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .8px;
  padding: 0 4px;
  margin-bottom: 4px;
  margin-top: 16px;
}

.sidebar-label:first-child { margin-top: 0; }

.script-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .1s;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border: 1px solid transparent;
}

.script-item:hover { background: var(--surface); }

.script-item.active {
  background: var(--surface2);
  border-color: var(--border2);
}

.script-item-name {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.script-item-meta {
  font-size: 10px;
  color: var(--text2);
  flex-shrink: 0;
}

.script-item-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
}

.new-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  border: 1px dashed var(--border2);
  background: none;
  width: 100%;
  transition: all .15s;
  font-family: inherit;
}

.new-btn:hover {
  color: var(--text);
  border-color: var(--border2);
  background: var(--surface);
}

/* MAIN */
.main {
  display: flex;
  flex-direction: column;
}

/* TOOLBAR */
.toolbar {
  border-bottom: 1px solid var(--border);
  padding: 12px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.toolbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
}

.name-input {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 500;
  background: none;
  border: none;
  color: var(--text);
  outline: none;
  width: 200px;
}

.name-input::placeholder { color: var(--text3); }

.divider-v {
  width: 1px;
  height: 18px;
  background: var(--border2);
}

.toolbar-meta {
  font-size: 12px;
  color: var(--text2);
}

.toolbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 500;
  border-radius: 7px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: all .12s;
  font-family: inherit;
  white-space: nowrap;
}

.btn:hover { background: var(--surface2); }
.btn:active { transform: scale(.98); }

.btn-primary {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
  font-weight: 600;
}

.btn-primary:hover { background: #e0e0e0; }

.btn-ghost {
  background: none;
  border-color: transparent;
  color: var(--text2);
}

.btn-ghost:hover { color: var(--text); background: var(--surface); }

.btn-danger {
  background: none;
  border-color: transparent;
  color: var(--text2);
}

.btn-danger:hover { color: var(--red); background: rgba(239,68,68,.06); border-color: rgba(239,68,68,.15); }

/* EDITOR */
.editor-wrap {
  flex: 1;
  position: relative;
}

textarea#code {
  width: 100%;
  height: 100%;
  min-height: 340px;
  padding: 24px 28px;
  font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace;
  font-size: 12.5px;
  line-height: 1.8;
  background: var(--bg);
  color: #d4d4d4;
  border: none;
  outline: none;
  resize: none;
  tab-size: 2;
}

/* LOADSTRING PANEL */
.ls-panel {
  border-top: 1px solid var(--border);
  padding: 16px 28px;
  display: none;
}

.ls-panel.show { display: block; }

.ls-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: .7px;
  margin-bottom: 8px;
}

.ls-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.ls-code {
  flex: 1;
  font-family: monospace;
  font-size: 12px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 7px;
  padding: 9px 14px;
  color: var(--green);
  overflow-x: auto;
  white-space: nowrap;
  cursor: pointer;
  transition: background .12s;
}

.ls-code:hover { background: var(--surface2); }

/* STATS ROW */
.stats-row {
  border-top: 1px solid var(--border);
  padding: 10px 28px;
  display: flex;
  align-items: center;
  gap: 20px;
}

.stat {
  font-size: 11px;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 5px;
}

.stat strong { color: var(--text); font-weight: 600; }

/* EMPTY STATE */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--text2);
  padding: 60px;
}

.empty-state h3 { font-size: 15px; font-weight: 600; color: var(--text); }
.empty-state p  { font-size: 13px; text-align: center; max-width: 280px; line-height: 1.6; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--surface3);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 10px 18px;
  font-size: 13px;
  font-weight: 500;
  z-index: 999;
  opacity: 0;
  transition: all .2s;
  white-space: nowrap;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.toast.ok  { border-color: rgba(34,197,94,.3); color: var(--green); }
.toast.err { border-color: rgba(239,68,68,.3);  color: var(--red); }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

@media (max-width: 700px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body>

<nav>
  <div class="logo">LuaHost <span>/ dashboard</span></div>
  <div class="nav-url" id="navUrl">—</div>
</nav>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-label">Scripts</div>
    <div id="scriptList"></div>
    <button class="new-btn" onclick="newScript()">+ New script</button>

    <div class="sidebar-label" style="margin-top:auto;padding-top:16px">Overview</div>
    <div style="display:flex;flex-direction:column;gap:4px;padding:0 4px">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2)">
        <span>Total scripts</span><strong id="sTotal" style="color:var(--text)">0</strong>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2)">
        <span>Total runs</span><strong id="sHits" style="color:var(--text)">0</strong>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2)">
        <span>Size</span><strong id="sSize" style="color:var(--text)">0 kb</strong>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main" id="mainArea">
    <div class="empty-state" id="emptyState">
      <h3>No script selected</h3>
      <p>Create a new script or pick one from the sidebar to start editing.</p>
      <button class="btn btn-primary" onclick="newScript()" style="margin-top:8px">New script</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const BASE = window.location.origin
document.getElementById('navUrl').textContent = BASE

let scripts = []
let activeId = null

// ── RENDER SIDEBAR ──
function renderSidebar() {
  const list = document.getElementById('scriptList')
  if (!scripts.length) { list.innerHTML = '<div style="font-size:12px;color:var(--text3);padding:4px">No scripts yet</div>'; return }
  list.innerHTML = ''
  scripts.sort((a,b) => new Date(b.updated) - new Date(a.updated)).forEach(s => {
    const div = document.createElement('div')
    div.className = 'script-item' + (s.id === activeId ? ' active' : '')
    div.onclick = () => openScript(s.id)
    div.innerHTML = `
      <div class="script-item-dot"></div>
      <div class="script-item-name">${s.name}</div>
      <div class="script-item-meta">${s.hits} runs</div>`
    list.appendChild(div)
  })

  document.getElementById('sTotal').textContent = scripts.length
  document.getElementById('sHits').textContent  = scripts.reduce((a,s) => a+s.hits, 0).toLocaleString()
  document.getElementById('sSize').textContent  = (scripts.reduce((a,s) => a+s.size, 0)/1024).toFixed(1) + ' kb'
}

// ── RENDER MAIN EDITOR ──
function renderEditor(script, code) {
  const main = document.getElementById('mainArea')
  const ls   = `loadstring(game:HttpGet("${BASE}/s/${script.id}"))()`
  const kb   = (script.size / 1024).toFixed(2)
  const upd  = new Date(script.updated).toLocaleString()

  main.innerHTML = `
    <div class="toolbar">
      <div class="toolbar-left">
        <input class="name-input" id="nameInput" value="${script.name}" placeholder="Script name" spellcheck="false">
        <div class="divider-v"></div>
        <span class="toolbar-meta" id="toolbarMeta">${kb} kb · ${script.hits} runs</span>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-ghost" onclick="discardEdit()">Discard</button>
        <button class="btn btn-danger" onclick="deleteScript('${script.id}')">Delete</button>
        <button class="btn btn-primary" onclick="saveScript()">Save</button>
      </div>
    </div>
    <div class="editor-wrap">
      <textarea id="code" spellcheck="false" placeholder="-- paste your lua here">${escHtml(code)}</textarea>
    </div>
    <div class="ls-panel show">
      <div class="ls-label">Loadstring</div>
      <div class="ls-row">
        <div class="ls-code" onclick="copyText('${ls}')" title="Click to copy">${ls}</div>
        <button class="btn" onclick="copyText('${ls}')">Copy</button>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat">ID <strong>${script.id}</strong></div>
      <div class="stat">Updated <strong>${upd}</strong></div>
    </div>`
}

function renderNewEditor() {
  const main = document.getElementById('mainArea')
  main.innerHTML = `
    <div class="toolbar">
      <div class="toolbar-left">
        <input class="name-input" id="nameInput" placeholder="Script name" spellcheck="false">
        <div class="divider-v"></div>
        <span class="toolbar-meta">new script</span>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-ghost" onclick="discardEdit()">Discard</button>
        <button class="btn btn-primary" onclick="saveScript()">Save & Host</button>
      </div>
    </div>
    <div class="editor-wrap">
      <textarea id="code" spellcheck="false" placeholder="-- paste your lua here"></textarea>
    </div>
    <div class="ls-panel" id="lsPanel">
      <div class="ls-label">Loadstring</div>
      <div class="ls-row">
        <div class="ls-code" id="lsCode" onclick="copyLoadstring()">save to generate</div>
        <button class="btn" onclick="copyLoadstring()">Copy</button>
      </div>
    </div>`
  activeId = null
  renderSidebar()
  document.getElementById('nameInput').focus()
}

// ── ACTIONS ──
function newScript() {
  renderNewEditor()
}

async function openScript(id) {
  activeId = id
  renderSidebar()
  try {
    const [codeRes, listRes] = await Promise.all([
      fetch('/s/' + id),
      fetch('/api/scripts')
    ])
    const code = await codeRes.text()
    const list = await listRes.json()
    const script = list.find(s => s.id === id)
    if (!script) return
    scripts = list
    renderSidebar()
    renderEditor(script, code)
  } catch { toast('Failed to load script', 'err') }
}

async function saveScript() {
  const name = document.getElementById('nameInput')?.value.trim()
  const code = document.getElementById('code')?.value
  if (!name) { toast('Enter a name', 'err'); document.getElementById('nameInput').focus(); return }
  if (!code?.trim()) { toast('Paste your Lua code first', 'err'); return }

  try {
    const res  = await fetch('/api/scripts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, code, id: activeId || undefined })
    })
    const data = await res.json()
    if (data.error) throw new Error(data.error)
    activeId = data.id

    // show loadstring if new script form
    const lsPanel = document.getElementById('lsPanel')
    const lsCode  = document.getElementById('lsCode')
    if (lsPanel && lsCode) {
      const ls = `loadstring(game:HttpGet("${BASE}/s/${data.id}"))()`
      lsCode.textContent = ls
      lsPanel.classList.add('show')
    }

    toast('Saved ✓', 'ok')
    await fetchScripts()
  } catch(e) { toast('Error: ' + e.message, 'err') }
}

async function deleteScript(id) {
  if (!confirm('Delete this script?')) return
  try {
    await fetch('/api/scripts/' + id, { method: 'DELETE' })
    activeId = null
    document.getElementById('mainArea').innerHTML = `
      <div class="empty-state" id="emptyState">
        <h3>No script selected</h3>
        <p>Create a new script or pick one from the sidebar.</p>
        <button class="btn btn-primary" onclick="newScript()" style="margin-top:8px">New script</button>
      </div>`
    toast('Deleted', 'ok')
    await fetchScripts()
  } catch { toast('Could not delete', 'err') }
}

function discardEdit() {
  activeId = null
  document.getElementById('mainArea').innerHTML = `
    <div class="empty-state" id="emptyState">
      <h3>No script selected</h3>
      <p>Create a new script or pick one from the sidebar.</p>
      <button class="btn btn-primary" onclick="newScript()" style="margin-top:8px">New script</button>
    </div>`
  renderSidebar()
}

// ── DATA ──
async function fetchScripts() {
  try {
    const res = await fetch('/api/scripts')
    scripts = await res.json()
    renderSidebar()
  } catch {}
}

// ── UTILS ──
function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copied', 'ok'))
}

function copyLoadstring() {
  const el = document.getElementById('lsCode')
  if (el && el.textContent !== 'save to generate') copyText(el.textContent)
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

let _tt
function toast(msg, type) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.className   = `toast show ${type || ''}`
  clearTimeout(_tt)
  _tt = setTimeout(() => t.className = 'toast', 2400)
}

fetchScripts()
</script>
</body>
</html>
